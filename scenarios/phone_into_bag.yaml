# 负例：手机放进了背包，背包被背走 → with(phone, person) 为真 → 不应提醒
name: phone_into_bag
duration_s: 16
vlm_latency_ms: 1100
default_view: {visible_places: [desk_1, door_1, chair_1], persons_visible: [person_1], quality: clear}
changes:
  - {t_ms: 2000, box: [0, 0, 224, 126], color: [255, 255, 255]}
  - {t_ms: 6000, box: [0, 0, 224, 126], color: [0, 0, 0]}
  - {t_ms: 9000, box: [224, 0, 448, 126], color: [0, 0, 0]}
  - {t_ms: 11000, box: [0, 126, 224, 252], color: [255, 255, 255]}
observations:
  - t_ms: 300
    view: {visible_places: [n2, n3, n4], persons_visible: [n1]}
    ops:
      - {op: new, tmp: n1, type: PERSON, cls: person, desc: 灰色卫衣, label: P1}
      - {op: new, tmp: n2, type: PLACE, cls: desk}
      - {op: new, tmp: n3, type: PLACE, cls: door}
      - {op: new, tmp: n4, type: PLACE, cls: chair}
      - {op: new, tmp: n5, type: OBJECT, cls: backpack, at: n4}
      - {op: set, key: n1.activity, value: sitting_working, src: seen}
  - t_ms: 2000
    ops:
      - {op: new, tmp: n1, type: OBJECT, cls: phone}
      - {op: act, type: PUT_DOWN, subj: person_1, obj: n1, target: desk_1}
  - t_ms: 6000
    ops:
      - {op: act, type: PUT_INTO, subj: person_1, obj: phone_1, target: backpack_1}
  - t_ms: 9000
    ops:
      - {op: act, type: PICK_UP, subj: person_1, obj: backpack_1}
      - {op: set, key: person_1.activity, value: packing, src: seen}
  - t_ms: 11000
    ops:
      - {op: act, type: MOVING_TOWARD, subj: person_1, obj: door_1}
expect:
  deliveries: []
  max_decisions: 0
