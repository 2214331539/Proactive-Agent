<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Proactive Agent · 系统架构</title>
<style>
:root{--ink:#202d40;--muted:#8190a1;--line:#e9edf2;--teal:#5fb39a;--amber:#d99b55;--rose:#d98a7e}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#fbfcfe}
body{overflow:hidden}
button,select,input{font:inherit}
.app{height:100dvh;display:flex;flex-direction:column;min-height:680px;max-width:1980px;margin:auto}
.header{height:80px;flex:0 0 80px;padding:18px 28px 12px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.identity{display:flex;align-items:center;gap:15px;min-width:0}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#fff,#edf4ff);border:1px solid #e3eaf2;box-shadow:0 5px 15px #a9b9d01c;display:grid;place-items:center;flex:0 0 auto}
.logo svg{width:26px;height:26px}
h1{margin:0;font-size:22px;line-height:1.1;font-weight:680;letter-spacing:-.04em}
h1 small{font-size:11.5px;font-weight:650;color:#9a6a3c;background:#fbeee0;border-radius:7px;padding:2px 7px;margin-left:8px;letter-spacing:0;vertical-align:3px}
.header-sub{font-size:12px;color:#6f8093;margin-top:7px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-sub em{font-style:normal;color:#2f445c;font-weight:650}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.control{height:36px;padding:0 13px;display:inline-flex;justify-content:center;align-items:center;gap:7px;border:1px solid #e5eaf0;border-radius:10px;background:white;color:#516075;font-size:12px;font-weight:590;cursor:pointer;transition:background .16s,border-color .16s,transform .16s}
.control:hover{background:#f4f7fb;border-color:#ccd8e6}.control:active{transform:scale(.98)}.control:focus-visible{outline:2px solid #83a8e9;outline-offset:2px}
.control.primary{background:#263a52;border-color:#263a52;color:white;padding:0 17px}
.control.primary:hover{background:#354f6d}
.control svg{width:14px;height:14px}
.control.icon-only{width:37px;padding:0}
.control select{background:transparent;color:inherit;border:0;outline:0;cursor:pointer;font-size:12px}
.live-dot{width:7px;height:7px;background:#68b7a4;border-radius:50%;box-shadow:0 0 0 4px #70c0b126;flex:0 0 auto}
.main{display:grid;grid-template-columns:minmax(0,1fr) 404px;gap:16px;padding:0 26px 20px 30px;min-height:0;flex:1}
.left{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;border:1px solid #e9edf2;border-radius:22px;background:radial-gradient(ellipse 75% 65% at 46% 52%,#ffffff 10%,#fcfdff 74%,#f8fafc 120%);box-shadow:0 16px 50px #536d9110}
#world{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#world.dragging{cursor:grabbing}#world.pointing{cursor:pointer}
.stage-top{position:absolute;top:16px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:12px}
.rule{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);border:1px solid #ece4d8;border-radius:12px;padding:7px 12px;box-shadow:0 6px 20px #8a6a4512}
.rule-k{font-size:10px;font-weight:700;letter-spacing:.08em;color:#a2683a;background:#fbeee0;border-radius:6px;padding:2px 7px}
.rule-f{font:600 13px/1 "JetBrains Mono","Cascadia Mono",Consolas,monospace;color:#2b3f56}
.rule-d{font-size:11px;color:#8a98a8}
.scene-tag{font-size:10.5px;line-height:1.55;color:#a3aebb;text-align:right}
.stage-bottom{position:absolute;bottom:14px;left:20px;right:18px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;gap:12px}
.legend{display:flex;flex-direction:column;gap:7px}
.legend-row{display:flex;align-items:center;flex-wrap:wrap;gap:13px;color:#8d9cab;font-size:10.5px}
.legend-item{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend-dot{width:8px;height:8px;border-radius:3px}
.kchip{font-size:9.5px;font-weight:700;border-radius:5px;padding:1px 6px;white-space:nowrap;flex:0 0 auto}
.k-ai{background:#fbeee0;color:#a2683a}.k-prog{background:#e8f0fa;color:#4d6f99}.k-store{background:#efebfa;color:#6c5fa6}
.spill{font-size:9.5px;font-weight:650;border-radius:5px;padding:0 5px;line-height:15px;white-space:nowrap;border:1px dashed #b9c4d1;color:#7c8b9b;background:#fff}
.spill.partial{border-style:solid;border-color:#e3cfb5;color:#a07444;background:#fdf6ed}
.hint{font-size:10.5px;color:#a8b3bf;white-space:nowrap}
.tip{position:absolute;z-index:4;max-width:270px;background:rgba(255,255,255,.97);border:1px solid #e3e9f0;border-radius:12px;padding:9px 12px;box-shadow:0 10px 30px #3c50681c;pointer-events:none;font-size:11.5px;line-height:1.6;color:#4f6276}
.tip b{font-size:12.5px;color:#22344a;font-weight:700}
.tip .tip-meta{display:flex;gap:6px;align-items:center;margin:3px 0 4px}
.tip[hidden]{display:none}
.timeline{flex:0 0 84px;border:1px solid #e9edf2;border-radius:18px;background:#fff;box-shadow:0 10px 30px #536d910b;padding:0 44px;position:relative;user-select:none}
.tl-inner{position:relative;height:100%}
.tl-axis{position:absolute;left:0;right:0;top:24px;height:3px;background:#edf1f5;border-radius:4px}
.tl-fill{position:absolute;left:0;top:24px;height:3px;width:0;background:linear-gradient(90deg,#83b4e3,#a79ddb 40%,#dfa96d 70%,#7fc1b1);border-radius:4px;pointer-events:none}
.tl-head{position:absolute;top:15px;width:2px;height:21px;margin-left:-1px;background:#d99b55;border-radius:2px;pointer-events:none}
.tl-mark{position:absolute;top:19px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:#fff;border:2px solid #cdd7e2;cursor:pointer;transition:transform .15s}
.tl-mark.val{border-radius:3px;transform:rotate(45deg) scale(.92)}
.tl-mark.done{border-color:var(--c)}
.tl-mark.now{background:var(--c);border-color:var(--c);transform:scale(1.25)}
.tl-mark.val.now{transform:rotate(45deg) scale(1.2)}
.tl-label{position:absolute;top:39px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;padding:2px 5px;border-radius:7px;white-space:nowrap}
.tl-label b{font-size:11px;font-weight:620;color:#7d8b9a}
.tl-label span{font-size:9.5px;color:#a8b3bf;font-variant-numeric:tabular-nums}
.tl-label.val b{color:#9a6e44}
.tl-label.now{background:#f3f6fa}.tl-label.now b{color:#22344a;font-weight:720}
.panel{border:1px solid #e9edf2;border-radius:22px;background:#fff;box-shadow:0 16px 50px #536d910d;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;gap:2px;padding:10px 16px 0;border-bottom:1px solid #eef1f4;flex:0 0 auto}
.tab-btn{border:0;background:transparent;padding:9px 12px 10px;font-size:12.5px;font-weight:640;color:#8a99aa;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab-btn.active{color:#263a52;border-bottom-color:#263a52}
.tab-body{padding:16px 20px 22px;overflow:auto;min-height:0;flex:1}
.tab-body.hidden{display:none}
.eyebrow{display:flex;align-items:center;gap:8px;color:#8391a2;font-size:10px;font-weight:690;letter-spacing:.1em;flex-wrap:wrap}
.eyebrow b{color:#4c5f75;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.phase-title{font-size:19px;line-height:1.3;letter-spacing:-.03em;font-weight:700;margin:11px 0 6px}
.phase-desc{font-size:12px;line-height:1.75;color:#6f8195;margin:0}
.sec{margin-top:18px}
.sec-head{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:#8e9db0;letter-spacing:.06em;font-weight:680;margin-bottom:8px}
.sec-head .aux{letter-spacing:0;color:#a8b4c1;font-weight:560}
.card{margin-top:16px;border:1px solid #eef1f5;border-radius:16px;padding:12px 14px 12px;background:#fbfcfe;transition:opacity .25s}
.card.live{border-color:#efdcc4;background:linear-gradient(180deg,#fffaf3,#fff)}
.card.dim{opacity:.62}
.card-head{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:#8e9db0;letter-spacing:.06em;font-weight:680}
.card-head .aux{letter-spacing:0;color:#a8b4c1;font-weight:560}
.card.live .card-head>span:first-child{color:#a2683a}
.card-empty{font-size:11.5px;color:#a9b4c0;margin-top:8px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
.stat3 div{display:flex;flex-direction:column;gap:2px}
.stat3 b{font-size:18px;font-weight:700;color:#2b3f56;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat3 span{font-size:10.5px;color:#8a98a8}
.stat3 i{font-style:normal;font-family:"JetBrains Mono",Consolas,monospace;color:#5b6f86;font-weight:700;margin-right:4px}
svg.vchart{width:100%;height:auto;display:block}
.verdict{display:flex;align-items:center;gap:9px;margin-top:4px;font-size:11.5px;color:#6f8195}
.dec-badge{font-size:11px;font-weight:720;border-radius:7px;padding:3px 9px;white-space:nowrap}
.d-silent{background:#eef1f5;color:#5c6d80}.d-wait{background:#fbe9d3;color:#9a632c}.d-speak{background:#dff2ea;color:#2f7d66}
table.beliefs{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
.beliefs th{text-align:left;font-weight:620;color:#a3afbc;font-size:9.5px;letter-spacing:.05em;padding:0 4px 6px 0}
.beliefs th:nth-child(1){width:38%}.beliefs th:nth-child(2){width:32%}.beliefs th:nth-child(3){width:16%}
.beliefs td{padding:6px 4px 6px 0;border-top:1px solid #f0f2f6;color:#4f6276;vertical-align:top;word-break:break-word}
.beliefs td.key{font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace;font-size:10px;color:#5d6f84}
.beliefs tr.changed td{background:#fff5e6}
.beliefs tr.changed{animation:statePop .9s ease}
.beliefs tr.empty td{color:#a9b4c0;font-style:italic;text-align:center}
@keyframes statePop{0%{opacity:.35}100%{opacity:1}}
.tag{display:inline-block;padding:1px 6px;border-radius:6px;font-size:9.5px;font-weight:660;white-space:nowrap}
.t-seen{background:#e6f0fb;color:#4c74a3}.t-heard{background:#f2ecfb;color:#6f5fa8}.t-user_confirmed{background:#e3f4ed;color:#3b8a70}
.t-holds{background:#e9f5f1;color:#3d8a72}.t-stale{background:#fdf1e2;color:#a8742f}
.derived{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.dv{border:1px dashed #d9dfe8;border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.dv span{font-size:9.5px;color:#9aa7b5;font-weight:620}
.dv b{font-size:11px;color:#3f5268;font-weight:640;line-height:1.4}
.dv.on{border-color:#d4cdee;background:#faf9fe}
.opp{border:1px solid #eee5d8;border-radius:12px;padding:9px 11px;background:#fffcf7}
.opp.resolved{border-color:#d3eadf;background:#f7fcfa}
.opp-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.opp-top code{font:650 11px "JetBrains Mono",Consolas,monospace;color:#7a5a36}
.opp.resolved .opp-top code{color:#3b7a66}
.pill{font-size:9.5px;font-weight:700;border-radius:6px;padding:1px 7px}
.pill.active{background:#fbe9d3;color:#9a632c}.pill.resolved{background:#dff2ea;color:#2f7d66}
.opp-grid{display:grid;grid-template-columns:34px 1fr;gap:3px 8px;margin-top:7px;font-size:11px;line-height:1.5}
.opp-grid span{color:#a0acb9}.opp-grid b{color:#4f6276;font-weight:560}
.need-none{font-size:11.5px;color:#a9b4c0}
.msg-block{border:1px solid #edf0f5;border-radius:12px;background:#fafbfd;margin-bottom:8px;overflow:hidden}
.msg-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid #eef1f5;font-size:11px}
.msg-type{font-weight:720;color:#34485f;display:flex;align-items:center;gap:6px}
.msg-type i{width:7px;height:7px;border-radius:2px;display:inline-block}
.msg-route{color:#8a99aa;font-size:10.5px;white-space:nowrap}
pre.msg{margin:0;padding:8px 10px;font:10.5px/1.55 "JetBrains Mono","Cascadia Mono",Consolas,monospace;color:#4a5a6d;white-space:pre-wrap;overflow-wrap:anywhere;max-height:170px;overflow:auto}
.j-k{color:#7465b4}.j-s{color:#3d8a76}.j-n{color:#b9772f}
.mod-index-group{margin-bottom:14px}
.mod-index-title{display:flex;align-items:baseline;gap:8px;font-size:11px;color:#4c5f75;font-weight:700;margin-bottom:6px}
.mod-index-title i{width:8px;height:8px;border-radius:3px;display:inline-block}
.mod-index-title span{font-size:10.5px;color:#a3afbc;font-weight:560}
.mod-link{display:flex;align-items:center;gap:8px;width:100%;border:1px solid #eef1f5;background:#fbfcfe;border-radius:10px;padding:7px 10px;margin-bottom:5px;cursor:pointer;text-align:left;color:#3f5268;font-size:12px;font-weight:600;white-space:nowrap}
.mod-link:hover{background:#f3f7fb;border-color:#dbe4ee}
.mod-link .grow{flex:1;overflow:hidden;text-overflow:ellipsis}
.mod-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:10px;font-weight:680;border-radius:6px;padding:2px 7px;background:#f1f4f8;color:#5d6f84}
.back-btn{border:0;background:transparent;color:#7f90a3;font-size:11px;cursor:pointer;padding:0;margin-left:auto}
.back-btn:hover{color:#2d4157}
.mod-name{font-size:20px;letter-spacing:-.03em;font-weight:720;margin:12px 0 6px}
.mod-role{font-size:12.5px;line-height:1.7;color:#4f6276;margin:0 0 12px}
dl.fields{margin:0}
dl.fields div{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:8px 0;border-top:1px solid #f0f2f6;font-size:11.5px;line-height:1.65}
dl.fields dt{color:#9aa7b5;font-weight:620;font-size:10.5px}
dl.fields dd{margin:0;color:#43566c}
dl.fields dd code{font:10.5px/1.6 "JetBrains Mono",Consolas,monospace;color:#5d6f84;background:#f5f7fa;border-radius:5px;padding:1px 5px}
.io{display:flex;flex-direction:column;gap:5px}
.io button{display:flex;gap:7px;align-items:center;border:1px solid #eef1f5;background:#fbfcfe;border-radius:9px;padding:6px 9px;font-size:11px;color:#4a5d72;cursor:pointer;text-align:left}
.io button:hover{background:#f3f7fb}
.io button i{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.io button em{font-style:normal;color:#8e9dad;margin-left:auto;font-size:10.5px}
.mod-now{margin-top:12px;font-size:11px;line-height:1.6;color:#8a6a45;background:#fdf5ea;border-radius:10px;padding:8px 10px}
.mod-now[hidden]{display:none}
.def-hero{font-size:15px;line-height:1.75;color:#3a4d63;font-weight:560;padding:4px 2px 14px;border-bottom:1px solid #eef1f4}
.def-hero em{font-style:normal;color:#22344a;font-weight:720;background:linear-gradient(transparent 62%,#fbe5c8 62%)}
.def-sec{padding:16px 0 4px;border-bottom:1px solid #f1f3f6}
.def-sec:last-child{border-bottom:0}
.def-q{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:720;color:#22344a;margin-bottom:10px}
.def-q span{font-size:10.5px;font-weight:600;color:#a3afbc}
table.mx{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
.mx th{font-size:10px;color:#9aa7b5;font-weight:650;padding:0 0 6px;text-align:center}
.mx th:first-child{text-align:left;width:40%}.mx th:last-child{text-align:right;width:20%}
.mx td{padding:6px 0;border-top:1px solid #f0f2f6;text-align:center;color:#4f6276}
.mx td:first-child{text-align:left}.mx td:last-child{text-align:right;font-weight:650}
.mx .y{color:#3d9a7e;font-weight:800}.mx .n{color:#cf7d70;font-weight:800}.mx .na{color:#c3ccd6}
.mx td.good{color:#2f7d66}.mx td.weak{color:#a07444}.mx td.no{color:#8d9aa8}
.mx-legend{font-size:10px;color:#a0acb9;margin-top:6px;line-height:1.6}
.formula{font:600 12px/1.6 "JetBrains Mono",Consolas,monospace;color:#2b3f56;background:#f7f8fb;border-radius:10px;padding:8px 10px;margin-bottom:8px}
.formula small{display:block;font:500 10.5px/1.5 Inter,"Microsoft YaHei",sans-serif;color:#8a98a8;margin-top:2px}
.q6{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;margin:4px 0 10px;font-size:10.5px;color:#6f8195}
.q6 i{font:normal 700 11px "JetBrains Mono",Consolas,monospace;color:#9a632c;margin-right:5px}
svg.dsvg{width:100%;height:auto;display:block}
.src-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.src{border:1px solid #e7ecf2;border-radius:10px;padding:7px 8px;background:#fbfcfe}
.src.todo{border-style:dashed;background:#fff}
.src b{display:block;font-size:11.5px;color:#34485f}
.src span{display:block;font-size:10px;color:#8e9cab;line-height:1.45;margin-top:2px}
.src em{font-style:normal;font-size:9px;font-weight:700;color:#3d8a72;float:right}
.src.todo em{color:#a3afbc}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:10px}
.lv div{padding:7px 6px 6px;font-size:10.5px;color:#5d6f84;background:#f3f5f9;line-height:1.35}
.lv div:first-child{border-radius:9px 0 0 9px}.lv div:last-child{border-radius:0 9px 9px 0}
.lv b{display:block;font-size:11px;color:#34485f}
.lv .now{background:#e7eef8}.lv .goal{background:#fbe9d3}
.lv-cap{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;font-size:9.5px;color:#a0acb9;margin-top:4px;text-align:center}
.def-note{font-size:11px;line-height:1.7;color:#7d8ea0;margin:8px 0 6px}
#err{position:fixed;left:12px;bottom:12px;z-index:9;background:#fff0ef;color:#a33b32;border:1px solid #f1c3be;border-radius:10px;padding:8px 12px;font-size:12px}
#err[hidden]{display:none}
@media(max-width:1180px){.main{grid-template-columns:minmax(0,1fr) 350px}.rule-d{display:none}}
@media(max-width:860px){body{overflow:auto}.app{height:auto}.main{display:flex;flex-direction:column}.stage{height:560px;flex:0 0 560px}.panel{min-height:560px}.controls{flex-wrap:wrap}.header{height:auto;flex-wrap:wrap}.header-sub{white-space:normal}}
@media(prefers-reduced-motion:reduce){.tl-mark,.control{transition:none}.beliefs tr.changed{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="identity">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 14C7 7 9 7 12 14S18 19 20 12" stroke="#6595cc" stroke-width="2.2" stroke-linecap="round"/><circle cx="5" cy="15.5" r="2.2" fill="#7cbcb4"/><circle cx="18.5" cy="13.5" r="2.2" fill="#d9ae79"/></svg></div>
      <div><h1>Proactive Agent<small>系统架构</small></h1>
        <div class="header-sub">主动 = <em>未被要求</em>时，系统判断<em>此刻开口比继续沉默更有价值</em>而发起的介入</div></div>
    </div>
    <div class="controls">
      <button class="control primary" id="playBtn" title="播放 / 暂停（空格）"><svg viewBox="0 0 16 16" fill="currentColor" id="playIcon"></svg><span id="playText">暂停</span></button>
      <button class="control icon-only" id="prevBtn" title="上一阶段（←）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m13 3-7 5 7 5M3.5 3v10"/></svg></button>
      <button class="control" id="stepBtn" title="下一阶段（→）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m3 3 7 5-7 5M12.5 3v10"/></svg>单步</button>

 const add=(x,y,z)=>{const xx=x*cy-z*sy,yy=(x*sy+z*cy)*se-y*ce;x0=Math.min(x0,xx);x1=Math.max(x1,xx);y0=Math.min(y0,yy);y1=Math.max(y1,yy)};

 fit.s=Math.max(20,Math.min((W-padX*2)/(x1-x0),(H-padTop-padBot)/(y1-y0)));
 fit.cx=(x0+x1)/2;fit.cy=(y0+y1)/2;fit.oy=padTop+(H-padTop-padBot)/2;
}

}

function compact(o){
 if(o===null||typeof o!=='object')return JSON.stringify(o);
 if(Array.isArray(o))return '['+o.map(compact).join(', ')+']';
 return '{'+Object.entries(o).map(([k,v])=>JSON.stringify(k)+': '+compact(v)).join(', ')+'}';
}
function fmt(o,ind=''){
 const s=compact(o);
 if(s.length<=50||ind.length>=4||o===null||typeof o!=='object')return s;
 if(Array.isArray(o))return '[\n'+o.map(v=>ind+'  '+fmt(v,ind+'  ')).join(',\n')+'\n'+ind+']';
 return '{\n'+Object.entries(o).map(([k,v])=>ind+'  '+JSON.stringify(k)+': '+fmt(v,ind+'  ')).join(',\n')+'\n'+ind+'}';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hl(json){
 return esc(json).replace(/("(?:[^"\\]|\\.)*")(\s*:)?|\b(true|false|null)\b|-?\b\d+(?:\.\d+)?\b/g,(m,str,colon)=>{
  if(str)return colon?`<span class="j-k">${str}</span>${colon}`:`<span class="j-s">${str}</span>`;
  return `<span class="j-n">${m}</span>`;
 });
}
const sgn=x=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(2);
function clockOf(ph,frac){
 const a=phases[ph],b=phases[ph+1];
 if(a.t===null)return '事后';
 const s=810+(b&&b.t!==null?lerp(a.t,b.t,frac):a.t);
 const m=Math.floor(s/60),ss=s-m*60;return String(m).padStart(2,'0')+':'+ss.toFixed(1).padStart(4,'0');
}

  <div class="formula">U(m) = p(1−q)·η·L − (1−p)·C_FA − C_int<br>开口 ⇔ U(m*) &gt; max(0, V(等))<small>V(等) = (1−H) × 等一会儿之后最好的开口价值。1 分 = 被一句短语音打扰一次。</small></div>
  <div class="q6"><span><i>p</i>这事是真的吗</span><span><i>q</i>他自己会处理吗</span><span><i>L</i>不管会多糟</span><span><i>η</i>说了有用吗</span><span><i>C</i>打扰与说错的代价</span><span><i>H</i>还能等吗</span></div>
  ${waterfallSVG()}
  <p class="def-note">同一件事在 14:01 价值为 −2.7（沉默），14:32 低于等待价值（再等等），14:40 才值得开口。说早了是打扰，说晚了没用。</p></div>
 <div class="def-sec"><div class="def-q">怎么说<span>每种方式各算一次 U，取最大</span></div>${ladderSVG()}
  <p class="def-note">实色是已实现的三种：等待、询问、提醒；虚线是待建的。用户直接提问走快速通道，不经过这套计算。</p></div>
 <div class="def-sec"><div class="def-q">机会从哪来<span>发现宁可多报，开口交给价值</span></div>
  <div class="src-grid">${SRCS.map(([n,t,e,done])=>`<div class="src ${done?'':'todo'}"><em>${done?'已有':'待建'}</em><b>${n} ${t}</b><span>${e}</span></div>`).join('')}</div>
  <div class="lv"><div><b>L0 被动应答</b>用户当场问</div><div class="now"><b>L1 时机主动</b>用户事先说过</div><div class="now"><b>L2 模板主动</b>工程师登记过</div><div class="goal"><b>L3 开放主动</b>系统自己发现</div></div>
  <div class="lv-cap"><span>保留，不算主动</span><span>现在</span><span>现在</span><span>目标</span></div></div>
 <div class="def-sec"><div class="def-q">主动得好不好<span>在标注视频上事后结算</span></div>${pgSVG()}
  <p class="def-note">说中 +L × 时效，每次开口 −C_int，说错再 −C_FA。PG 要和每小时误报 FAH、平均提前量一起看：只看命中，系统会学会什么都说；只看误报，它会学会什么都不说。</p></div>`;
}

/* ---------------- 交互 ---------------- */
function setTab(tab){
 activeTab=tab;
 document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 for(const k of['run','mod','def'])$('tab-'+k).classList.toggle('hidden',tab!==k);
 if(tab==='mod')renderModPanel();
}
function select(id){selected=id&&byId[id]?id:null;setTab('mod');drawScene()}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
$('tab-mod').addEventListener('click',e=>{const b=e.target.closest('[data-goto]');if(b)select(b.dataset.goto)});
$('layerLegend').innerHTML=LAYER_ORDER.map(L=>`<span class="legend-item"><i class="legend-dot" style="background:${LAYERS[L].color}"></i>${LAYERS[L].name}</span>`).join('');

const tl=$('tl'),N=phases.length,posPct=i=>(i/(N-1)*100);
function buildTimeline(){
 let html='<div class="tl-axis"></div><div class="tl-fill" id="tlFill"></div>';
 phases.forEach((s,i)=>{
  const col=LAYERS[s.layer].color,cls=s.val?'val':'';
  html+=`<div class="tl-mark ${cls}" data-i="${i}" style="left:${posPct(i)}%;--c:${col}" title="${esc(s.clock+' '+s.title)}"></div>`;
  html+=`<div class="tl-label ${cls}" data-i="${i}" style="left:${posPct(i)}%"><b>${esc(s.mark)}</b><span>${esc(s.clock)}</span></div>`;
 });
 html+='<div class="tl-head" id="tlHead"></div>';
 tl.innerHTML=html;
 tl.addEventListener('click',e=>{const m=e.target.closest('[data-i]');if(m)seek(starts[+m.dataset.i])});
}
function updateTimeline(ph,frac){
 const p=(ph<N-1?lerp(posPct(ph),posPct(ph+1),frac):100).toFixed(3)+'%';
 $('tlFill').style.width=p;$('tlHead').style.left=p;
 tl.querySelectorAll('.tl-mark').forEach(el=>{const i=+el.dataset.i;el.classList.toggle('now',i===ph);el.classList.toggle('done',i<ph)});
 tl.querySelectorAll('.tl-label').forEach(el=>el.classList.toggle('now',+el.dataset.i===ph));
}
function updateUI(force=false){
 const ph=getPhase(pt),frac=clamp((pt-starts[ph])/phases[ph].dwell,0,1);
 $('clock').textContent=clockOf(ph,frac);
 updateTimeline(ph,frac);
 if(ph===lastPhase&&!force)return;
 lastPhase=ph;renderRunPanel(ph);
}
function seek(t){pt=clamp(t,0,TOTAL-.001);lastPhase=-1;updateUI(true);drawScene()}
function step(dir){setPlayState(false);const ph=getPhase(pt);seek(starts[clamp(ph+dir,0,N-1)])}
function setPlayState(next){playing=next;$('playText').textContent=playing?'暂停':'播放';$('playIcon').innerHTML=playing?'<rect x="4" y="3" width="3" height="10" rx=".9"/><rect x="9" y="3" width="3" height="10" rx=".9"/>':'<path d="M4 2.6a.65.65 0 0 1 .97-.57l8.4 5.39a.68.68 0 0 1 0 1.16l-8.4 5.39A.65.65 0 0 1 4 13.4z"/>'}
$('playBtn').addEventListener('click',()=>setPlayState(!playing));
$('stepBtn').addEventListener('click',()=>step(1));
$('prevBtn').addEventListener('click',()=>step(-1));
$('resetBtn').addEventListener('click',()=>{seek(0);setPlayState(true)});
$('viewBtn').addEventListener('click',()=>{camera={...initialCamera};drawScene()});
$('speed').addEventListener('change',e=>{speed=Number(e.target.value)||1});
window.addEventListener('keydown',e=>{
 if(e.target.closest&&e.target.closest('select,input,textarea'))return;
 if(e.code==='Space'){e.preventDefault();setPlayState(!playing)}
 else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);
});

const tip=$('tip');
function showTip(id,x,y){
 if(!id){tip.hidden=true;return}
 const n=byId[id];
 tip.innerHTML=`<b>${n.code} ${esc(n.title)}</b><div class="tip-meta"><span class="kchip k-${n.kind}">${KIND[n.kind].label}</span><span class="chip">${LAYERS[n.layer].name}</span>${stPill(n.st)}</div>${esc(MODS[n.id].role)}`;
 tip.hidden=false;
 const r=canvas.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
 tip.style.left=clamp(x+16,8,r.width-tw-8)+'px';tip.style.top=clamp(y+16,8,r.height-th-8)+'px';
}
function pickNode(x,y){
 for(let i=drawOrder.length-1;i>=0;i--){const n=drawOrder[i],r=n.labelRect;
  if(r&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return n.id;
  if(n.hull&&inPoly(x,y,n.hull))return n.id}
 return null;
}
let press=null;
canvas.addEventListener('pointerdown',e=>{press={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{
 const r=canvas.getBoundingClientRect();
 if(press){
  if(Math.hypot(e.clientX-press.x,e.clientY-press.y)>4)press.moved=true;
  if(press.moved){tip.hidden=true;canvas.classList.add('dragging');camera.yaw=clamp(camera.yaw+(e.clientX-press.lx)*.0033,-.3,.85);camera.elev=clamp(camera.elev+(e.clientY-press.ly)*.0024,.3,1.2);press.lx=e.clientX;press.ly=e.clientY;drawScene()}
  return;
 }
 const x=e.clientX-r.left,y=e.clientY-r.top,id=pickNode(x,y);
 if(id!==hovered){hovered=id;canvas.classList.toggle('pointing',!!id);drawScene()}
 showTip(id,x,y);
});
function endPress(e){
 if(press&&!press.moved&&e.type==='pointerup'){const r=canvas.getBoundingClientRect(),id=pickNode(e.clientX-r.left,e.clientY-r.top);if(id)select(id)}
 press=null;canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup',endPress);canvas.addEventListener('pointercancel',endPress);
canvas.addEventListener('pointerleave',()=>{tip.hidden=true;if(hovered){hovered=null;canvas.classList.remove('pointing');drawScene()}});
canvas.addEventListener('wheel',e=>{e.preventDefault();camera.zoom=clamp(camera.zoom*(e.deltaY<0?1.07:.93),.6,1.8);drawScene()},{passive:false});
function resize(){const rect=canvas.getBoundingClientRect();W=rect.width;H=rect.height;computeFit();dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);drawScene()}
new ResizeObserver(resize).observe(canvas);window.addEventListener('resize',resize);
function loop(now){
 if(!stamp)stamp=now;const dt=Math.min((now-stamp)/1000,.07);stamp=now;
 if(playing){pt+=dt*speed;if(pt>=TOTAL){pt=0;lastPhase=-1}updateUI()}
 drawScene();requestAnimationFrame(loop);
}

buildTimeline();renderDef();
const qs=new URLSearchParams(location.search);
if(qs.has('p'))pt=starts[clamp(parseInt(qs.get('p'))||0,0,N-1)]+.01;
if(qs.get('paused')==='1')playing=false;
if(qs.has('speed'))speed=Number(qs.get('speed'))||1;
setPlayState(playing);
if(qs.has('node'))select(qs.get('node'));else if(qs.get('tab'))setTab(qs.get('tab'));
resize();updateUI(true);requestAnimationFrame(loop);
})();
</script>
</body>
</html>
