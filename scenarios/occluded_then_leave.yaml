# 难例：桌面被遮挡时有人靠近过桌子 → phone_1.location 转 stale → 离开时只允许 ASK，不能断言“还在桌上”
name: occluded_then_leave
duration_s: 16
vlm_latency_ms: 1100
default_view: {visible_places: [desk_1, door_1], persons_visible: [person_1], quality: clear}
changes:
  - {t_ms: 2000, box: [0, 0, 224, 126], color: [255, 255, 255]}
  - {t_ms: 7000, box: [0, 0, 448, 126], color: [0, 0, 0]}
  - {t_ms: 9000, box: [224, 126, 448, 252], color: [0, 0, 0]}
  - {t_ms: 11000, box: [0, 126, 224, 252], color: [255, 255, 255]}
observations:
  - t_ms: 300
    view: {visible_places: [n2, n3], persons_visible: [n1]}
    ops:
      - {op: new, tmp: n1, type: PERSON, cls: person, label: P1}
      - {op: new, tmp: n2, type: PLACE, cls: desk}
      - {op: new, tmp: n3, type: PLACE, cls: door}
      - {op: set, key: n1.activity, value: sitting_working, src: seen}
  - t_ms: 2000
    ops:
      - {op: new, tmp: n1, type: OBJECT, cls: phone}
      - {op: act, type: PUT_DOWN, subj: person_1, obj: n1, target: desk_1}
  - t_ms: 7000  # 有人挡住了桌面，同时站在桌边（看不见手上的动作）
    set_view: {visible_places: [door_1], quality: partial}
    ops:
      - {op: set, key: person_1.near, value: desk_1, src: seen}
      - {op: set, key: person_1.activity, value: standing, src: seen}
  - t_ms: 9000
    ops:
      - {op: set, key: person_1.activity, value: packing, src: seen}
  - t_ms: 11000
    ops:
      - {op: act, type: MOVING_TOWARD, subj: person_1, obj: door_1}
expect:
  deliveries: [{kind: possible_forgotten_item, mode: ASK, after_ms: 11000, before_ms: 16000}]
  max_decisions: 1
