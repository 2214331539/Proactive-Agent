[project]
name = "proactive-agent"
version = "0.1.0"
description = "Proactive Video Agent V2: state-conditioned perception, single-writer FastState, trigger-edge decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "pillow>=10",
  "pyyaml>=6",
  "av>=12",
  "openai>=1.40",
  "httpx>=0.27",  # Jev 客户端直接用；openai 3.x 已改依赖 httpx2
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
speech = ["faster-whisper>=1.0"]
face = ["onnxruntime>=1.17", "insightface>=0.7.3"]
bench = ["huggingface_hub>=0.23"]
dev = ["pytest>=8"]

[project.scripts]
pa = "pa.runtime.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pa*"]

[tool.setuptools.package-data]
pa = ["agenda/*.yaml", "config/*.yaml", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
